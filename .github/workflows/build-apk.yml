name: Build Crimson FixPoint Android APK & Publish Release Tag

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Signed Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Stale Legacy v1 Kotlin Files (Retained by Sync)
        shell: bash
        run: |
          cat << 'EOF' > /tmp/v2_valid_kotlin_files.txt
          app/src/androidTest/java/com/example/ExampleInstrumentedTest.kt
          app/src/main/java/com/example/MainActivity.kt
          app/src/main/java/com/example/ai/MlKitOrderOcrEngine.kt
          app/src/main/java/com/example/ai/OrderOcrParser.kt
          app/src/main/java/com/example/ai/RiderIntelligenceEngine.kt
          app/src/main/java/com/example/data/local/FixPointDaos.kt
          app/src/main/java/com/example/data/local/FixPointDatabase.kt
          app/src/main/java/com/example/data/local/FixPointEntities.kt
          app/src/main/java/com/example/data/local/RiderPreferencesDataStore.kt
          app/src/main/java/com/example/data/repository/CloudSyncPrepRepository.kt
          app/src/main/java/com/example/data/repository/FixPointRepository.kt
          app/src/main/java/com/example/integration/DeliveryPlatformAdapters.kt
          app/src/main/java/com/example/integration/JobRadarEngine.kt
          app/src/main/java/com/example/model/JobRadarModels.kt
          app/src/main/java/com/example/model/RiderAiModels.kt
          app/src/main/java/com/example/model/SmartEarningsModels.kt
          app/src/main/java/com/example/model/TacticalModels.kt
          app/src/main/java/com/example/model/WorkCostModels.kt
          app/src/main/java/com/example/service/GpsKeepAliveService.kt
          app/src/main/java/com/example/service/LocationService.kt
          app/src/main/java/com/example/service/RiderNotificationListenerService.kt
          app/src/main/java/com/example/service/ScreenReaderCaptureService.kt
          app/src/main/java/com/example/ui/components/HudStateComponents.kt
          app/src/main/java/com/example/ui/components/InteractiveZoneMapCanvas.kt
          app/src/main/java/com/example/ui/components/PremiumDesignSystem.kt
          app/src/main/java/com/example/ui/screens/AiAssistantScreen.kt
          app/src/main/java/com/example/ui/screens/DashboardScreen.kt
          app/src/main/java/com/example/ui/screens/EarningsAnalyticsScreen.kt
          app/src/main/java/com/example/ui/screens/JobRadarScreen.kt
          app/src/main/java/com/example/ui/screens/ProfileSettingsScreen.kt
          app/src/main/java/com/example/ui/screens/SecondaryScreens.kt
          app/src/main/java/com/example/ui/screens/SmartMapScreen.kt
          app/src/main/java/com/example/ui/theme/Color.kt
          app/src/main/java/com/example/ui/theme/Theme.kt
          app/src/main/java/com/example/ui/theme/Type.kt
          app/src/main/java/com/example/util/NetworkClients.kt
          app/src/main/java/com/example/util/TacticalSoundEngine.kt
          app/src/main/java/com/example/viewmodel/FixPointViewModel.kt
          app/src/main/java/com/example/worker/DailyMaintenanceWorker.kt
          app/src/test/java/com/example/ExampleRobolectricTest.kt
          app/src/test/java/com/example/ExampleUnitTest.kt
          app/src/test/java/com/example/FixPointDatabaseMigrationTest.kt
          app/src/test/java/com/example/JobRadarAndAdaptersTest.kt
          app/src/test/java/com/example/RiderAiAndOcrUnitTest.kt
          app/src/test/java/com/example/SmartEarningsAndRouteTest.kt
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/v2_valid_kotlin_files.txt
          while IFS= read -r kt_file; do
            if ! grep -Fxq "$kt_file" /tmp/v2_valid_kotlin_files.txt; then
              echo "Removing stale legacy file: $kt_file"
              rm -f "$kt_file"
            fi
          done < <(find app/src -name '*.kt' | sort)
          rm -f /tmp/v2_valid_kotlin_files.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_DIR/licenses"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

          # Write standard Android SDK & Preview license hashes so AGP auto-downloads SDK 36.1 & Build-Tools 36.0.0
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          # Also run sdkmanager --licenses if available on runner
          SDKMANAGER=$(find "$SDK_DIR" -name "sdkmanager" -type f | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug & Release Signing Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'crimsonfixpoint2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'crimsonfixpoint2026' }}
        run: |
          # 1. Ensure debug.keystore exists for debugConfig in app/build.gradle.kts
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure release keystore (my-upload-key.jks) exists for release signingConfig in app/build.gradle.kts
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          elif [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Crimson FixPoint,OU=Tactical Rider Systems,O=CrimsonFixPoint,L=Bangkok,ST=Bangkok,C=TH"
          fi

          # 3. Ensure .env file exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Run Unit, Migration & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true"

      - name: Build Signed Debug & Release APKs with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'crimsonfixpoint2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'crimsonfixpoint2026' }}
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true"

      - name: Prepare Named APK Artifacts & Determine Release Tag
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/CrimsonFixPoint-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apk/CrimsonFixPoint-release.apk
          ls -lh dist-apk/

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v2.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Upload Signed Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonFixPoint-Debug-APK
          path: dist-apk/CrimsonFixPoint-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonFixPoint-Release-APK
          path: dist-apk/CrimsonFixPoint-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create Tag & Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Crimson FixPoint ${{ env.RELEASE_TAG }} (AI Rider Assistant & Smart Earnings 2.0)"
          body: |
            ## 🎯 Crimson FixPoint ${{ env.RELEASE_TAG }} — Android APK Release
            ดาวน์โหลดไฟล์ติดตั้งสำหรับมือถือ Android ได้โดยตรงจากไฟล์แนบด้านล่าง:
            - **`CrimsonFixPoint-release.apk`**: ไฟล์ติดตั้งเวอร์ชัน Release (ลงนามพร้อมติดตั้ง)
            - **`CrimsonFixPoint-debug.apk`**: ไฟล์ติดตั้งเวอร์ชัน Debug
          files: |
            dist-apk/CrimsonFixPoint-release.apk
            dist-apk/CrimsonFixPoint-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
